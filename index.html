<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRI PNG Viewer</title>
<style>
:root{--bg:#0e0f12;--panel:#16181d;--line:#262932;--fg:#e6e8ee;--mute:#8b90a0;--acc:#6ea8ff}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--panel:#fff;--line:#dfe2e8;--fg:#1b1d23;--mute:#6a7080;--acc:#2f6fed}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;display:flex;height:100vh}
#side{width:260px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 8px}
#side h1{font-size:15px;margin:0 8px 10px}
#side details{margin-left:10px}
#side summary{cursor:pointer;padding:4px 6px;border-radius:6px;list-style:none}
#side summary::before{content:"▸ ";color:var(--mute)}
#side details[open]>summary::before{content:"▾ "}
#side summary:hover,#side .leaf:hover{background:var(--line)}
#side .leaf{display:block;padding:4px 6px 4px 22px;border-radius:6px;cursor:pointer;margin-left:10px}
#side .on{background:var(--acc)!important;color:#fff}
#side .c{color:var(--mute);font-size:12px;margin-left:4px}
#main{flex:1;overflow:auto;padding:16px}
#bar{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
#bar b{font-size:16px}
#bar input[type=range]{width:140px}
#menu{display:none}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--sz,160px),1fr));gap:8px}
#grid figure{margin:0;background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1;position:relative}
#grid img{width:100%;height:100%;object-fit:contain;display:block}
#grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:2px 6px;font-size:11px;color:#ddd;background:linear-gradient(transparent,rgba(0,0,0,.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#empty{color:var(--mute);padding:40px 0}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:10;flex-direction:column}
#lb.show{display:flex}
#lb img{max-width:96vw;max-height:88vh;object-fit:contain}
#lb .cap{color:#ddd;margin-top:8px;font-size:13px}
#lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;font-size:26px;width:48px;height:48px;border-radius:50%;cursor:pointer}
#lb .x{top:14px;right:14px}#lb .p{left:14px;top:50%}#lb .n{right:14px;top:50%}
@media(max-width:700px){
 #side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:.2s;width:80%}
 #side.open{transform:none}#menu{display:inline-block}
}
</style>
</head>
<body>
<nav id="side"><h1>MRI PNG</h1><div id="tree"></div></nav>
<main id="main">
 <div id="bar">
  <button id="menu">☰ 목록</button><b id="title">폴더를 선택하세요</b><span id="count" class="c"></span>
  <label>크기 <input id="sz" type="range" min="90" max="360" value="160"></label>
 </div>
 <div id="grid"></div><div id="empty">왼쪽에서 Series를 선택하면 이미지가 표시됩니다.</div>
</main>
<div id="lb"><button class="x">×</button><button class="p">‹</button><img alt=""><div class="cap"></div><button class="n">›</button></div>
<script>
const thumb=(id,w)=>`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
const $=s=>document.querySelector(s);
let cur=[],idx=0,activeEl=null;
const count=n=>(n.f?n.f.length:0)+(n.d?n.d.reduce((a,x)=>a+count(x),0):0);
function build(n,path,host){
  if(n.d){
    const d=document.createElement("details");
    const s=document.createElement("summary");
    s.innerHTML=`${n.n}<span class="c">${count(n)}</span>`;d.append(s);
    n.d.forEach(c=>build(c,path.concat(n.n),d));
    if(n.f)d.append(leaf(n,path));
    host.append(d);
  }else host.append(leaf(n,path));
}
function leaf(n,path){
  const a=document.createElement("a");a.className="leaf";
  a.innerHTML=`${n.n}<span class="c">${n.f.length}</span>`;
  a.onclick=()=>{activeEl&&activeEl.classList.remove("on");a.classList.add("on");activeEl=a;show(n,path.concat(n.n));$("#side").classList.remove("open");location.hash=encodeURIComponent(path.concat(n.n).join("/"))};
  a._p=path.concat(n.n).join("/");a._n=n;a._pa=path.concat(n.n);
  return a;
}
function show(n,p){
  cur=n.f||[];$("#title").textContent=p.slice(1).join(" / ");$("#count").textContent=cur.length+"장";
  $("#empty").style.display=cur.length?"none":"block";
  const g=$("#grid");g.innerHTML="";
  cur.forEach((f,i)=>{const fg=document.createElement("figure");
    fg.innerHTML=`<img loading="lazy" src="${thumb(f[0],400)}" alt=""><figcaption>${f[1]}</figcaption>`;
    fg.onclick=()=>open(i);g.append(fg)});
  $("#main").scrollTop=0;
}
function open(i){idx=(i+cur.length)%cur.length;const f=cur[idx];
  $("#lb img").src=thumb(f[0],2000);$("#lb .cap").textContent=`${f[1]}  (${idx+1}/${cur.length})`;$("#lb").classList.add("show")}
const close=()=>$("#lb").classList.remove("show");
$("#lb .x").onclick=close;$("#lb .p").onclick=e=>{e.stopPropagation();open(idx-1)};$("#lb .n").onclick=e=>{e.stopPropagation();open(idx+1)};
$("#lb").onclick=e=>{if(e.target.id==="lb")close()};
addEventListener("keydown",e=>{if(!$("#lb").classList.contains("show"))return;
  if(e.key==="Escape")close();else if(e.key==="ArrowLeft")open(idx-1);else if(e.key==="ArrowRight")open(idx+1)});
$("#sz").oninput=e=>$("#grid").style.setProperty("--sz",e.target.value+"px");
$("#menu").onclick=()=>$("#side").classList.toggle("open");
fetch("data.json").then(r=>r.json()).then(root=>{
  root.d.forEach(c=>build(c,[root.n],$("#tree")));
  const h=decodeURIComponent(location.hash.slice(1));
  const t=[...document.querySelectorAll(".leaf")].find(a=>a._p===h);
  if(t){for(let p=t.parentElement;p&&p.id!=="tree";p=p.parentElement)if(p.tagName==="DETAILS")p.open=true;t.click()}
});
</script>
</body>
</html>
